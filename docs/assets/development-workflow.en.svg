<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1680" width="1360" height="1680">
<style>text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }</style>
<defs>
<marker id="blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
</defs>
<rect data-graph-role="background" width="1360" height="1680" fill="#ffffff"/>
<text x="120" y="64" font-size="34" fill="#111827" font-weight="600">Skill Development Workflow</text>
<text x="120" y="102" font-size="18" fill="#6b7280" font-weight="400">MMF is the delivery unit · Spec defines the contract · tickets execute inside an MMF</text>
<path data-graph-role="edge" data-source="input" data-target="plan" d="M 680 300 V 400" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<path data-graph-role="edge" data-source="plan" data-target="tickets" d="M 900 560 V 680" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<path data-graph-role="edge" data-source="plan" data-target="work" d="M 240 560 V 980" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<path data-graph-role="edge" data-source="tickets" data-target="work" d="M 900 850 V 980" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<path data-graph-role="edge" data-source="work" data-target="delivery" d="M 680 1190 V 1320" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<path data-graph-role="edge" data-source="input" data-target="work" d="M 120 230 H 60 V 1080 H 120" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#orange)"/>
<g data-graph-role="node" data-node-id="input">
<rect x="120" y="160" width="1120" height="140" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5"/>
<text x="144" y="198" font-size="24" fill="#111827" font-weight="600">01 Task Routing</text>
<text x="144" y="236" font-size="16" fill="#6b7280" font-weight="400">Large → MMF planning; regular → minimal plan + grill-with-docs; small → implement</text>
<text x="144" y="268" font-size="16" fill="#6b7280" font-weight="400">Bug → diagnosing-bugs → verification + local Git closeout; refactor / optimize → analyze, then route</text>
</g>
<g data-graph-role="node" data-node-id="plan">
<rect x="120" y="400" width="1120" height="160" rx="8" fill="#eff6ff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="144" y="438" font-size="24" fill="#111827" font-weight="600">02 MMF Planning</text>
<text x="144" y="476" font-size="16" fill="#6b7280" font-weight="400">to-epic: Epic → independently shippable MMFs; to-spec: one Spec per MMF</text>
<text x="144" y="508" font-size="16" fill="#6b7280" font-weight="400">One MR per MMF; deliver MMFs in turn; shared enabling work belongs to the first MMF that needs it</text>
</g>
<g data-graph-role="node" data-node-id="tickets">
<rect x="400" y="680" width="840" height="170" rx="8" fill="#faf5ff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="424" y="718" font-size="24" fill="#111827" font-weight="600">03 Optional Tickets</text>
<text x="424" y="756" font-size="16" fill="#6b7280" font-weight="400">vertical-slicing → ticket-sizing → user decision → to-tickets</text>
<text x="424" y="788" font-size="16" fill="#6b7280" font-weight="400">Oversized: ticket-split-100k; show split signals + MMF total before publishing</text>
<text x="424" y="820" font-size="16" fill="#6b7280" font-weight="400">Execute by dependency in one MMF MR; deliver when all tickets are complete</text>
</g>
<g data-graph-role="node" data-node-id="work">
<rect x="120" y="980" width="1120" height="210" rx="8" fill="#f0fdf4" stroke="#d1d5db" stroke-width="1.5"/>
<text x="144" y="1018" font-size="24" fill="#111827" font-weight="600">04 Implement + Verify</text>
<text x="144" y="1056" font-size="16" fill="#6b7280" font-weight="400">git-worktree isolates writes → implement vertical slices → tdd chooses red / green as needed</text>
<text x="144" y="1088" font-size="16" fill="#6b7280" font-weight="400">Relevant E2E / real execution / existing formal checks → reconcile → code-review (Standards + Spec)</text>
<text x="144" y="1120" font-size="16" fill="#6b7280" font-weight="400">Then git-commit; delivery-pipeline can orchestrate execution under the target project&#x27;s contract</text>
</g>
<g data-graph-role="node" data-node-id="delivery">
<rect x="120" y="1320" width="1120" height="230" rx="8" fill="#fff7ed" stroke="#d1d5db" stroke-width="1.5"/>
<text x="144" y="1358" font-size="24" fill="#111827" font-weight="600">05 Integrate + Deliver</text>
<text x="144" y="1396" font-size="16" fill="#6b7280" font-weight="400">Local: git-rebase-main → main; remote: git-push-pr → gh-merge-pr</text>
<text x="144" y="1428" font-size="16" fill="#6b7280" font-weight="400">PR: freeze Review Packet → current-head Standards + Spec → evidence-led specialists → Verdict</text>
<text x="144" y="1460" font-size="16" fill="#6b7280" font-weight="400">Authorized merge + parity readback; deployment and business acceptance follow the target project&#x27;s contract</text>
</g>
<text x="696" y="354" font-size="16" fill="#2563eb" font-weight="400">Large scope</text>
<text x="916" y="622" font-size="16" fill="#2563eb" font-weight="400">Needs tickets</text>
<text x="256" y="622" font-size="16" fill="#2563eb" font-weight="400">Fits one</text>
<text x="256" y="650" font-size="16" fill="#2563eb" font-weight="400">context:</text>
<text x="256" y="678" font-size="16" fill="#2563eb" font-weight="400">skip tickets</text>
<text x="916" y="916" font-size="16" fill="#2563eb" font-weight="400">Approved tickets</text>
<text x="696" y="1262" font-size="16" fill="#2563eb" font-weight="400">Verified commit</text>
<text x="120" y="1602" font-size="16" fill="#2563eb" font-weight="400">Main delivery flow</text>
<text x="400" y="1602" font-size="16" fill="#ea580c" font-weight="400">Regular / small: enter implementation</text>
<text x="120" y="1640" font-size="15" fill="#6b7280" font-weight="400">Remote writes, PR merge and release each follow explicit authority; implemented does not mean deployed or accepted.</text>
</svg>
