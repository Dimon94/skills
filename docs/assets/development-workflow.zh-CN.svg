<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1680" width="1360" height="1680">
<style>text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }</style>
<defs>
<marker id="blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
</defs>
<rect data-graph-role="background" width="1360" height="1680" fill="#ffffff"/>
<text x="120" y="64" font-size="34" fill="#111827" font-weight="600">Skill 开发链路</text>
<text x="120" y="102" font-size="18" fill="#6b7280" font-weight="400">以 MMF 为交付单位 · Spec 定义合同 · ticket 在 MMF 内执行</text>
<path data-graph-role="edge" data-source="input" data-target="plan" d="M 680 300 V 400" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<path data-graph-role="edge" data-source="plan" data-target="tickets" d="M 900 560 V 680" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<path data-graph-role="edge" data-source="plan" data-target="work" d="M 240 560 V 980" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<path data-graph-role="edge" data-source="tickets" data-target="work" d="M 900 850 V 980" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<path data-graph-role="edge" data-source="work" data-target="delivery" d="M 680 1190 V 1320" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<path data-graph-role="edge" data-source="input" data-target="work" d="M 120 230 H 60 V 1080 H 120" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#orange)"/>
<g data-graph-role="node" data-node-id="input">
<rect x="120" y="160" width="1120" height="140" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5"/>
<text x="144" y="198" font-size="24" fill="#111827" font-weight="600">01 任务分流</text>
<text x="144" y="236" font-size="16" fill="#6b7280" font-weight="400">大型需求 → MMF 规划；常规需求 → 最小计划 + grill-with-docs；小改动 → implement</text>
<text x="144" y="268" font-size="16" fill="#6b7280" font-weight="400">Bug → diagnosing-bugs → 验证与本地 Git 收口；重构 / 优化先分析，再分流</text>
</g>
<g data-graph-role="node" data-node-id="plan">
<rect x="120" y="400" width="1120" height="160" rx="8" fill="#eff6ff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="144" y="438" font-size="24" fill="#111827" font-weight="600">02 MMF 规划</text>
<text x="144" y="476" font-size="16" fill="#6b7280" font-weight="400">to-epic：Epic → 可独立上线的 MMF；to-spec：每个 MMF 一份 Spec</text>
<text x="144" y="508" font-size="16" fill="#6b7280" font-weight="400">一个 MMF 对应一个 MR；逐个 MMF 交付，共用使能工作归首个用到它的 MMF</text>
</g>
<g data-graph-role="node" data-node-id="tickets">
<rect x="400" y="680" width="840" height="170" rx="8" fill="#faf5ff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="424" y="718" font-size="24" fill="#111827" font-weight="600">03 可选拆票</text>
<text x="424" y="756" font-size="16" fill="#6b7280" font-weight="400">vertical-slicing → ticket-sizing → 用户裁决 → to-tickets</text>
<text x="424" y="788" font-size="16" fill="#6b7280" font-weight="400">超线票先走 ticket-split-100k；发布前展示逐票拆分信号与 MMF 合计</text>
<text x="424" y="820" font-size="16" fill="#6b7280" font-weight="400">默认在同一个 MMF 的 MR 分支内按依赖执行，完成全部票后整体交付</text>
</g>
<g data-graph-role="node" data-node-id="work">
<rect x="120" y="980" width="1120" height="210" rx="8" fill="#f0fdf4" stroke="#d1d5db" stroke-width="1.5"/>
<text x="144" y="1018" font-size="24" fill="#111827" font-weight="600">04 实现与验证</text>
<text x="144" y="1056" font-size="16" fill="#6b7280" font-weight="400">git-worktree 隔离写任务 → implement 按垂直切片实现 → tdd 按需红绿</text>
<text x="144" y="1088" font-size="16" fill="#6b7280" font-weight="400">相关 E2E / 真实运行 / 已覆盖的形式验证 → 对账 → code-review（Standards + Spec）</text>
<text x="144" y="1120" font-size="16" fill="#6b7280" font-weight="400">通过后 git-commit；delivery-pipeline 可按目标项目合同编排执行</text>
</g>
<g data-graph-role="node" data-node-id="delivery">
<rect x="120" y="1320" width="1120" height="230" rx="8" fill="#fff7ed" stroke="#d1d5db" stroke-width="1.5"/>
<text x="144" y="1358" font-size="24" fill="#111827" font-weight="600">05 集成与交付</text>
<text x="144" y="1396" font-size="16" fill="#6b7280" font-weight="400">本地集成：git-rebase-main → main；远程交付：git-push-pr → gh-merge-pr</text>
<text x="144" y="1428" font-size="16" fill="#6b7280" font-weight="400">PR 固定 Review Packet → current-head 双轴审查 → 按证据追加专项 → Verdict</text>
<text x="144" y="1460" font-size="16" fill="#6b7280" font-weight="400">获授权后合并与 parity readback；部署与业务验收按目标项目合同执行</text>
</g>
<text x="696" y="354" font-size="16" fill="#2563eb" font-weight="400">大型需求</text>
<text x="916" y="622" font-size="16" fill="#2563eb" font-weight="400">需要拆票</text>
<text x="256" y="622" font-size="16" fill="#2563eb" font-weight="400">可容纳于</text>
<text x="256" y="650" font-size="16" fill="#2563eb" font-weight="400">一个上下文</text>
<text x="256" y="678" font-size="16" fill="#2563eb" font-weight="400">则跳过拆票</text>
<text x="916" y="916" font-size="16" fill="#2563eb" font-weight="400">已确认的票</text>
<text x="696" y="1262" font-size="16" fill="#2563eb" font-weight="400">已验证提交</text>
<text x="120" y="1602" font-size="16" fill="#2563eb" font-weight="400">主交付链</text>
<text x="400" y="1602" font-size="16" fill="#ea580c" font-weight="400">常规 / 小改动直接进入实现</text>
<text x="120" y="1640" font-size="15" fill="#6b7280" font-weight="400">远程写入、PR 合并与发布各自沿用明确授权；实现完成不等于已部署或已验收。</text>
</svg>
